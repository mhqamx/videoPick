name: DouyinDownLoadSPMDemo
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "17.0"
packages:
  DouyinDownLoadSPM:
    path: ../spm
targets:
  DouyinDownLoadSPMDemo:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.DouyinDownLoadSPMDemo
        PRODUCT_NAME: DouyinDownLoadSPMDemo
        DEVELOPMENT_TEAM: 57SZ35YG6E
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 保存下载的视频或图片到相册
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 允许将下载的视频或图片保存到相册
    dependencies:
      - package: DouyinDownLoadSPM
